<!--
  ══════════════════════════════════════════════════════════════
  مكة — نظام إدارة مصنع الأبواب | الواجهة: «المدينة»
  ══════════════════════════════════════════════════════════════
  البنية المعمارية (فصل الطبقات):
    • طبقة العرض  : js/features/*  + js/ui/components.js  — الشاشات والمكوّنات فقط، لا تلمس قاعدة البيانات مباشرة.
    • طبقة المنطق : js/core/repo.js + attendance.js + ai.js — قواعد العمل (الرواتب، الفواتير، المخزون، الحضور).
    • طبقة البيانات: js/core/db.js — IndexedDB محلية على الجهاز (تعمل بدون إنترنت).
    • التنقّل     : js/app.js — موجّه (Router) بالهاش قابل للتوسّع بإضافة مسار جديد لأي قسم مستقبلي.
    • الأحداث     : js/core/bus.js — ناقل أحداث يحدّث لوحة التحكم لحظياً بعد أي عملية.
  التطبيق يُحمَّل كاملاً داخل #app بواسطة الموجّه.
-->
<div id="app" aria-live="polite"></div>
